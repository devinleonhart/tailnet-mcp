name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# One run per ref: a new push cancels the in-flight run for that branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tailnet-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test database
        run: |
          docker network create tailnet-mcp-test-net
          docker run -d --name postgres-test --network tailnet-mcp-test-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:18.7
          timeout 60 sh -c 'until docker exec postgres-test pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

      - name: Run linters, security scans and specs
        run: |
          docker run --rm --network tailnet-mcp-test-net \
            -v "$GITHUB_WORKSPACE:/gem" \
            -e POSTGRES_URL=postgresql://postgres:postgres@postgres-test:5432/postgres \
            tailnet-mcp:test bin/ci

      - name: Cleanup
        if: always()
        run: |
          docker rm -f postgres-test || true
          docker network rm tailnet-mcp-test-net || true

  # A gem has no image to publish. A push to master tags the version in
  # lib/tailnet_mcp/version.rb, once, and applications pin that tag.
  release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the version if it is new
        run: |
          version=$(sed -nE 's/.*VERSION = "([^"]+)".*/\1/p' lib/tailnet_mcp/version.rb)
          [ -n "$version" ] || { echo "::error::No version in lib/tailnet_mcp/version.rb"; exit 1; }
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists; nothing to tag"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
